<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fly Brain</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10141c; --muted: #8a93a3; --hair: #e4e8ee;
    --in: #e04f24; --out: #0f9d63; --ant: #e0921b;
    --font: 'Inter', system-ui, Segoe UI, Roboto, sans-serif;
    --mono: 'Roboto Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font-family: var(--font); font-size: 13px; -webkit-font-smoothing: antialiased; }
  #app { display: grid; grid-template-columns: 1fr 320px; height: 100vh; background: #fff; }

  #view { position: relative; min-width: 0; overflow: hidden; cursor: grab;
          background: radial-gradient(130% 100% at 50% 6%, #ffffff 0%, #f4f7fb 58%, #e9eef5 100%); }
  #view:active { cursor: grabbing; }
  #view canvas { display: block; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #labels div { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-weight: 700; font-size: 12.5px; transition: opacity .3s; }
  #labels div.station { padding: 3px 9px; border-radius: 6px; background: rgba(255,255,255,.9); box-shadow: 0 0 0 1px rgba(16,20,28,.08); }
  #labels div.region { transition: none; font-size: 10.5px; letter-spacing: .08em; color: #c8401f;
                       padding: 2px 6px; border-radius: 5px; background: rgba(255,255,255,.9); box-shadow: 0 0 0 1px rgba(200,64,31,.22); }

  #rail { position: absolute; left: 26px; right: 26px; top: 24px; display: flex; gap: 5px; }
  .step { flex: 1; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; font: inherit; }
  .step .bar { height: 3px; border-radius: 2px; background: #e0e5ee; overflow: hidden; }
  .step .bar i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 2px; }
  .step span { display: block; margin-top: 6px; font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #b4bcc9; transition: color .25s; }
  .step.on span, .step.done span { color: var(--ink); }
  .step.done .bar i { width: 100%; background: #b6bfcd; }
  #rail.finished .step .bar i { width: 100%; background: var(--ink); }
  .step:hover .bar { background: #ccd4e0; }

  #panel { border-left: 1px solid var(--hair); padding: 18px; display: grid; grid-template-rows: auto auto minmax(0,1fr) auto; gap: 11px; background: #fcfdfe; }
  .seg { display: flex; background: #eef1f6; border-radius: 8px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; border-radius: 6px; padding: 6px 0; font: 600 12px var(--font); color: #566074; cursor: pointer; }
  .seg button.on { background: var(--ink); color: #fff; }
  .controls { display: flex; gap: 7px; }
  #send { position: relative; flex: 1; border: 0; border-radius: 9px; padding: 11px 0; background: var(--ink); color: #fff; font: 600 13px var(--font); cursor: pointer; overflow: hidden; }
  #send i { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(255,255,255,.18); }
  #send b { position: relative; }
  #pause { border: 1px solid var(--hair); background: #fff; border-radius: 9px; padding: 0 12px; font: 600 12px var(--font); color: #566074; cursor: pointer; }
  #pause:disabled { color: #c4cad4; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .flow { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 0; }
  .card { border: 1px solid var(--hair); border-radius: 10px; background: #fff; padding: 8px 10px; transition: .3s; }
  .card.live { border-color: var(--ink); }
  .card h2 { margin: 0 0 5px; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; display: flex; justify-content: space-between; }
  .card h2 em { font-style: normal; color: var(--muted); font-family: var(--mono); font-size: 9.5px; letter-spacing: 0; }
  canvas.plot { width: 100%; display: block; }
  .chain { display: flex; gap: 6px; }
  .chain div { flex: 1; text-align: center; border: 1px dashed #dee3ea; border-radius: 8px; padding: 6px 2px; font-size: 11px; font-weight: 600; color: #566074; transition: .3s; }
  .chain div.live { border-style: solid; border-color: var(--ink); color: var(--ink); }

  #score { border-top: 1px solid var(--hair); padding-top: 9px; min-height: 92px; opacity: 0; transition: opacity .5s; }
  #score.show { opacity: 1; }
  #score b { font-size: 25px; font-weight: 700; color: var(--out); font-family: var(--mono); letter-spacing: -.02em; }
  #bench { width: 100%; height: 58px; display: block; margin-top: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
  @media (max-width: 1000px) { #app { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; } #panel { border-left: 0; border-top: 1px solid var(--hair); } }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="rail"></div>
    <div id="loading">loading</div>
    <div id="labels"></div>
    <div class="sr" id="live" aria-live="polite"></div>
  </div>

  <div id="panel">
    <div class="seg" id="epochs"></div>
    <div class="controls"><button id="send"><i></i><b>Send epoch</b></button><button id="pause" disabled>Pause</button></div>

    <div class="flow">
      <div class="card" id="c-in"><h2>Input<em id="in-snr"></em></h2><canvas id="noisy" class="plot"></canvas></div>
      <div class="chain"><div id="c-ant">Antenna</div><div id="c-brain">Brain</div><div id="c-motor">Motor</div></div>
      <div class="card" id="c-mot"><h2>Motor</h2><canvas id="motor" class="plot"></canvas></div>
      <div class="chain"><div id="c-dec">Decoder</div></div>
      <div class="card" id="c-out"><h2>Output<em id="out-cc"></em></h2><canvas id="out" class="plot"></canvas></div>
    </div>

    <div id="score"><b id="score-v"></b><canvas id="bench"></canvas></div>
  </div>
</div>
<script src="./js/vendor/three.min.js"></script>
<script src="./js/vendor/OrbitControls.js"></script>
<script src="./js/vendor/GLTFLoader.js"></script>
<script src="./js/vendor/RoomEnvironment.js"></script>
<script src="./js/eeg-sim.js"></script>
</body>
</html>
