<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fly Brain</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #ffffff; --panel: #f4f6fa; --ink: #1a2030; --muted: #6b7386; --line: #d9dee8;
          --in: #e8562a; --out: #178f60; --ant: #e08a1e; --brain: #4a7bd0; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, Segoe UI, Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 400px; height: 100vh; }
  #view { position: relative; min-width: 0; overflow: hidden; cursor: grab; }
  #view canvas { display: block; }
  #title { position: absolute; left: 18px; top: 14px; font-size: 22px; font-weight: 600; pointer-events: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; pointer-events: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #labels div { position: absolute; transform: translate(-50%, -50%); font-weight: 700; font-size: 15px; letter-spacing: .02em; white-space: nowrap;
                text-shadow: 0 0 4px #fff, 0 0 8px #fff, 0 0 12px #fff; transition: opacity .25s; }
  #labels div.big { font-size: 19px; }
  #labels div.region { color: #5b6478; font-size: 13px; }
  #panel { background: var(--panel); border-left: 1px solid var(--line); padding: 12px 16px; overflow: hidden; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button.on { border-color: var(--out); color: var(--out); }
  button.send { background: var(--in); color: #fff; border-color: var(--in); font-weight: 600; }
  input[type=range] { width: 100px; }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .lab b { color: var(--ink); }
  canvas.plot { width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 6px; display: block; }
  #noisy, #out { height: 88px; }
  #motor { height: 118px; }
  .arrow { text-align: center; color: var(--muted); font-size: 18px; line-height: 1; margin: -2px 0; }
  .chain { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .chain span { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--ink); background: #fff; }
  .chain span.ant { border-color: var(--ant); } .chain span.brn { border-color: var(--brain); } .chain span.mot, .chain span.dec { border-color: var(--out); }
  #gain { font-size: 15px; color: var(--out); font-weight: 600; }
  @media (max-width: 900px) { #app { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; } #panel { border-left: 0; border-top: 1px solid var(--line); overflow-y: auto; } }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="title">Fly brain</div>
    <div id="loading">loading</div>
    <div id="labels"></div>
  </div>
  <div id="panel">
    <div class="row" id="epochs"></div>
    <div class="row"><button id="send" class="send">Send epoch</button><span id="stage" style="color:var(--muted);font-size:14px"></span></div>
    <div class="lab"><b style="color:var(--in)">Input signal</b></div>
    <canvas id="noisy" class="plot"></canvas>
    <div class="arrow">&#8595;</div>
    <div class="lab"><b>Fly model</b></div>
    <div class="chain"><span class="ant">Antenna 672</span>&#8594;<span class="brn">Brain 34,257</span>&#8594;<span class="mot">Motor 1,421</span></div>
    <div class="lab">Motor neurons</div>
    <canvas id="motor" class="plot"></canvas>
    <div class="arrow">&#8595;</div>
    <div class="chain"><span class="dec">Decoder</span></div>
    <div class="arrow">&#8595;</div>
    <div class="lab"><b style="color:var(--out)">Output</b> <span style="color:#333;text-transform:none;letter-spacing:0">black = true EEG</span></div>
    <canvas id="out" class="plot"></canvas>
    <div id="gain"></div>
  </div>
</div>
<script src="./js/vendor/three.min.js"></script>
<script src="./js/vendor/OrbitControls.js"></script>
<script src="./js/eeg-sim.js"></script>
</body>
</html>
